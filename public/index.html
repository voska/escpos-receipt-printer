<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Printer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 0.9em;
        }

        .status.connected {
            background: rgba(76, 175, 80, 0.3);
        }

        .status.disconnected {
            background: rgba(244, 67, 54, 0.3);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2::before {
            content: '📋';
            font-size: 1.2em;
        }

        .card.shopping h2::before {
            content: '🛒';
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
            font-size: 0.9em;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .items-container {
            margin-bottom: 10px;
        }

        .item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            align-items: center;
        }

        .item-row input {
            flex: 1;
        }

        .item-row input.quantity {
            flex: 0 0 100px;
        }

        .btn-remove {
            background: #f44336;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 12px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }

        .btn-remove:hover {
            background: #d32f2f;
        }

        .btn-add {
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9em;
            margin-bottom: 15px;
            transition: background 0.3s;
        }

        .btn-add:hover {
            background: #45a049;
        }

        button[type="submit"] {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease-out;
            z-index: 1000;
        }

        .message.success {
            background: #4CAF50;
        }

        .message.error {
            background: #f44336;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .required {
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖨️ Receipt Printer</h1>
            <div class="status" id="printerStatus">Checking printer...</div>
        </div>

        <div class="cards">
            <!-- Todo Card -->
            <div class="card">
                <h2>Todo Ticket</h2>
                <form id="todoForm">
                    <div class="form-group">
                        <label>Title <span class="required">*</span></label>
                        <input type="text" id="todoTitle" required placeholder="Fix the login bug">
                    </div>
                    <div class="form-group">
                        <label>Assignee</label>
                        <input type="text" id="todoAssignee" placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="todoDescription" placeholder="Additional details about the task..."></textarea>
                    </div>
                    <button type="submit">Print Todo</button>
                </form>
            </div>

            <!-- Shopping List Card -->
            <div class="card shopping">
                <h2>Shopping List</h2>
                <form id="shoppingForm">
                    <div class="form-group">
                        <label>List Title</label>
                        <input type="text" id="shoppingTitle" placeholder="Grocery Shopping">
                    </div>
                    <div class="form-group">
                        <label>Items <span class="required">*</span></label>
                        <div class="items-container" id="itemsContainer">
                            <div class="item-row">
                                <input type="text" placeholder="Item name" class="item-name" required>
                                <input type="text" placeholder="Qty" class="quantity">
                                <button type="button" class="btn-remove" onclick="removeItem(this)">×</button>
                            </div>
                        </div>
                        <button type="button" class="btn-add" onclick="addItem()">+ Add Item</button>
                    </div>
                    <button type="submit">Print Shopping List</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Check printer status on load
        async function checkPrinterStatus() {
            try {
                const response = await fetch('/printer-status');
                const data = await response.json();
                const statusEl = document.getElementById('printerStatus');
                
                if (data.connected) {
                    statusEl.textContent = '🟢 Printer Connected';
                    statusEl.className = 'status connected';
                } else {
                    statusEl.textContent = '🔴 Printer Disconnected';
                    statusEl.className = 'status disconnected';
                }
            } catch (error) {
                console.error('Error checking printer status:', error);
                const statusEl = document.getElementById('printerStatus');
                statusEl.textContent = '⚠️ Status Unknown';
                statusEl.className = 'status';
            }
        }

        // Show message
        function showMessage(text, type = 'success') {
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            document.body.appendChild(message);
            
            setTimeout(() => {
                message.remove();
            }, 3000);
        }

        // Todo form submission
        document.getElementById('todoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('todoTitle').value;
            const assignee = document.getElementById('todoAssignee').value;
            const description = document.getElementById('todoDescription').value;
            
            try {
                const response = await fetch('/api/print-todo', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ title, assignee, description }),
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('✅ Todo ticket printed successfully!', 'success');
                    document.getElementById('todoForm').reset();
                } else {
                    showMessage(`❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage(`❌ Failed to print: ${error.message}`, 'error');
            }
        });

        // Shopping list form submission
        document.getElementById('shoppingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('shoppingTitle').value || 'Shopping List';
            const itemRows = document.querySelectorAll('.item-row');
            const items = [];
            
            itemRows.forEach(row => {
                const nameInput = row.querySelector('.item-name');
                const quantityInput = row.querySelector('.quantity');
                
                if (nameInput.value.trim()) {
                    if (quantityInput.value.trim()) {
                        items.push({
                            name: nameInput.value.trim(),
                            quantity: quantityInput.value.trim()
                        });
                    } else {
                        items.push(nameInput.value.trim());
                    }
                }
            });
            
            if (items.length === 0) {
                showMessage('❌ Please add at least one item', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/print-shopping-list', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ title, items }),
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage(`✅ Shopping list printed (${items.length} items)!`, 'success');
                    document.getElementById('shoppingForm').reset();
                    // Reset to one item row
                    document.getElementById('itemsContainer').innerHTML = `
                        <div class="item-row">
                            <input type="text" placeholder="Item name" class="item-name" required>
                            <input type="text" placeholder="Qty" class="quantity">
                            <button type="button" class="btn-remove" onclick="removeItem(this)">×</button>
                        </div>
                    `;
                } else {
                    showMessage(`❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage(`❌ Failed to print: ${error.message}`, 'error');
            }
        });

        // Add item to shopping list
        function addItem() {
            const container = document.getElementById('itemsContainer');
            const newRow = document.createElement('div');
            newRow.className = 'item-row';
            newRow.innerHTML = `
                <input type="text" placeholder="Item name" class="item-name">
                <input type="text" placeholder="Qty" class="quantity">
                <button type="button" class="btn-remove" onclick="removeItem(this)">×</button>
            `;
            container.appendChild(newRow);
        }

        // Remove item from shopping list
        function removeItem(button) {
            const container = document.getElementById('itemsContainer');
            if (container.children.length > 1) {
                button.parentElement.remove();
            } else {
                showMessage('⚠️ Keep at least one item row', 'error');
            }
        }

        // Check printer status on load
        checkPrinterStatus();
        
        // Refresh status every 30 seconds
        setInterval(checkPrinterStatus, 30000);
    </script>
</body>
</html>
